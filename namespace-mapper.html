<!doctype html><meta charset="utf-8"><meta name="color-scheme" content="light dark"><title>Wiki manifest editor</title>
<style>:root{font:14px system-ui;color:#202124;background:#fff}body{max-width:1250px;margin:24px auto;padding:0 16px}@media(prefers-color-scheme:dark){:root{color:#eee;background:#202124}input,select,button,textarea{color:inherit;background:#303134;border-color:#666}}h1{font-size:21px;font-weight:500}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input,select,button,textarea{border:1px solid #aaa;border-radius:4px;padding:7px}button{background:#2563eb;color:#fff;cursor:pointer}button.secondary{background:transparent;color:inherit}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #aaa;padding:7px 5px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:inherit}.wide{width:100%}.muted{color:#77808b}.count{margin-left:auto}</style>
<h1>Wiki manifest editor</h1><p>Pre-tune an export manually or refine an LLM-generated manifest. Changes stay local until download.</p>
<div class=bar><input id=file type=file accept=".json"><button id=addNs disabled>Add namespace</button><button id=save disabled>Save</button><button id=download disabled>Download modified manifest</button><label>Auto-save <input id=auto type=checkbox disabled></label><select id=interval disabled><option value="1">1 min</option><option value="5" selected>5 min</option><option value="10">10 min</option></select><span id=count class=count></span></div>
<details><summary>Namespaces</summary><table><thead><tr><th>Source ID</th><th>Source name</th><th>Destination name</th><th>Destination ID</th><th></th></tr></thead><tbody id=nsrows></tbody></table></details>
<div class=bar><input id=filter placeholder="Filter pages…"><input id=bulkPrefix placeholder="Title prefix for selected pages"><select id=bulkNs><option value="">Bulk namespace…</option></select><button id=applyBulk disabled>Apply to selected</button><button id=clear class=secondary disabled>Clear selection</button></div>
<table><thead><tr><th><input id=all type=checkbox></th><th>Source page</th><th>Destination namespace</th><th>Parent / subpage path</th><th>Destination title</th><th>Decision note</th><th>Office</th></tr></thead><tbody id=rows></tbody></table>
<script>
let m,ns=[],decisions={},timer;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
file.onchange=async()=>{m=JSON.parse(await $('file').files[0].text());ns=(m.namespaces||[]).map(x=>typeof x==='number'?{id:x,name:String(x)}:x);(m.page_mapping||[]).forEach(x=>decisions[x.pageid]=x);render();['addNs','save','download','auto','interval','applyBulk','clear'].forEach(id=>$(id).disabled=false)};
function render(){nsrows.innerHTML=ns.map((x,i)=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td><input data-n="${i}" value="${esc(x.name)}"></td><td><input data-i="${i}" value="${x.id||''}"></td><td><button class=del data-d="${i}">Remove</button></td></tr>`).join('');bulkNs.innerHTML='<option value="">Bulk namespace…</option>'+ns.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.id})</option>`).join('');let q=$('filter').value.toLowerCase();rows.innerHTML=m.pages.map(p=>{let d=decisions[p.pageid]||{};if(q&&!(`${p.title} ${p.source}`.toLowerCase().includes(q)))return '';let office=(m.office_adjustments||[]).some(x=>(x.referenced_by||[]).includes(p.title));return `<tr data-row="${p.pageid}"><td><input class=pick type=checkbox></td><td><b>${esc(p.title)}</b><div class=muted>id ${p.pageid}, ns ${p.ns}</div></td><td><select class=destNs><option value="">Keep</option>${ns.map(x=>`<option value="${x.id}"${String(d.namespace)==String(x.id)?' selected':''}>${esc(x.name)} (${x.id})</option>`).join('')}</select></td><td><input class=destTitle value="${esc(d.title||d.destination_title||p.title)}"></td><td><textarea class=note rows=1>${esc(d.note||'')}</textarea></td><td>${office?'adjustment':''}</td></tr>`}).join('');count.textContent=`${m.pages.length} pages · ${ns.length} namespaces`}
filter.oninput=render;all.onchange=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=all.checked);clear.onclick=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=false);
addNs.onclick=()=>{let name=prompt('New namespace name');if(!name)return;let id=ns.reduce((a,x)=>Math.max(a,+x.id||0),99)+1;ns.push({id,name,create_if_missing:true});render()};
applyBulk.onclick=()=>{document.querySelectorAll('tr[data-row]').forEach(r=>{if(!r.querySelector('.pick').checked)return;if(bulkNs.value)r.querySelector('.destNs').value=bulkNs.value;if(bulkPrefix.value)r.querySelector('.destTitle').value=bulkPrefix.value+r.querySelector('.destTitle').value})};
function capture(){document.querySelectorAll('tr[data-row]').forEach(r=>{let id=+r.dataset.row,d=decisions[id]||{};d.pageid=id;d.namespace=r.querySelector('.destNs').value.trim()!==''?+r.querySelector('.destNs').value:null;d.title=r.querySelector('.destTitle').value;d.note=r.querySelector('.note').value;decisions[id]=d});ns.forEach((x,i)=>{let n=document.querySelector(`[data-n="${i}"]`),v=document.querySelector(`[data-i="${i}"]`);if(n)x.name=n.value;if(v)x.id=v.value.trim()!==''?+v.value:null})}
function saveLocal(){capture();localStorage.setItem('wiki-manifest-draft',JSON.stringify({m,ns,decisions}));count.textContent='Saved '+new Date().toLocaleTimeString()}
save.onclick=saveLocal;auto.onchange=()=>{clearInterval(timer);if(auto.checked)timer=setInterval(saveLocal,+interval.value*60000)};interval.onchange=()=>{if(auto.checked){clearInterval(timer);timer=setInterval(saveLocal,+interval.value*60000)}};addNs.onclick=()=>{let name=prompt('New namespace name');if(name){ns.push({id:null,name,create_if_missing:true});render()}};nsrows.onclick=e=>{if(e.target.classList.contains('del')){ns.splice(+e.target.dataset.d,1);render()}};
download.onclick=()=>{saveLocal();let o=structuredClone(m);o.page_mapping=Object.values(decisions);o.namespace_mapping=ns.map(x=>({destination_name:x.name,destination_id:x.create_if_missing?null:x.id,create_if_missing:!!x.create_if_missing}));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='manifest-modified.json';a.click()};
const oldRender=render;render=()=>{oldRender();document.querySelectorAll('tr[data-row]').forEach(r=>{let id=+r.dataset.row,d=decisions[id]||{},c=document.createElement('td');c.innerHTML=`<input class=parent value="${esc(d.parent_path||'')}" placeholder="Parent/section">`;r.insertBefore(c,r.children[3])})};
const baseCapture=capture;capture=()=>{baseCapture();document.querySelectorAll('tr[data-row]').forEach(r=>{decisions[+r.dataset.row].parent_path=r.querySelector('.parent')?.value||''})};
</script>
